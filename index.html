<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audio Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="player-wrap">
  <div class="player-card">

    <!-- Visualizer -->
    <div class="visualizer-area">
      <div id="vizBars"></div>
      <div class="toast" id="toast"></div>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <div style="display:flex;align-items:center;">
        <span class="track-title" id="trackTitle">Audio Player Demo</span>
        <span id="statusDot" style="display:none;"><span class="status-dot"></span></span>
      </div>
      <div class="track-sub" id="trackSub">Generated tone sequence · 30s</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
      <div class="time-row">
        <span id="timeCurrent">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </div>

    <!-- Main Controls -->
    <div class="controls-row">
      <div class="side-controls">
        <!-- Loop -->
        <button class="ctrl-btn" id="loopBtn" title="Loop (L)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
        <!-- Skip Back -->
        <button class="ctrl-btn" id="skipBBtn" title="Skip back 10s (←)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
          </svg>
        </button>
      </div>

      <!-- Play / Pause -->
      <button class="play-btn" id="playBtn" aria-label="Play / Pause (Space)">
        <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="white">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>

      <div class="side-controls">
        <!-- Skip Forward -->
        <button class="ctrl-btn" id="skipFBtn" title="Skip forward 10s (→)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-.49-3.51"/>
          </svg>
        </button>
        <!-- Mute -->
        <button class="ctrl-btn" id="muteBtn" title="Mute / Unmute (M)">
          <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Volume & Speed Sliders -->
    <div class="settings-row">
      <div class="ctrl-group">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6b8a" stroke-width="2" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <input type="range" id="volSlider" min="0" max="100" value="80" step="1">
        <span class="ctrl-val" id="volVal">80%</span>
      </div>
      <div class="ctrl-group">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b6b8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <input type="range" id="speedSlider" min="0.5" max="2" value="1" step="0.25">
        <span class="ctrl-val" id="speedVal">1x</span>
      </div>
    </div>

    <!-- Keyboard Shortcuts -->
    <div class="kbd-hint">
      <div class="kbd-item"><kbd>Space</kbd> play/pause</div>
      <div class="kbd-item"><kbd>M</kbd> mute</div>
      <div class="kbd-item"><kbd>L</kbd> loop</div>
      <div class="kbd-item"><kbd>←</kbd><kbd>→</kbd> skip 10s</div>
      <div class="kbd-item"><kbd>↑</kbd><kbd>↓</kbd> volume</div>
    </div>

  </div><!-- /.player-card -->
</div><!-- /.player-wrap -->

<script src="script.js"></script>
</body>
</html>
